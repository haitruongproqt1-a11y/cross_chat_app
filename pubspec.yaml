name: cross_chat_app
description: "A cross-platform real-time chat application for Mobile (iOS/Android) and PC (Windows/macOS/Linux/Web)."
publish_to: 'none'
version: 1.0.25+26

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Firebase Core & Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # Media & File Picking
  image_picker: ^1.1.2
  file_picker: ^8.1.3
  cached_network_image: ^3.4.1

  # Audio & Media Playback
  audioplayers: ^6.0.0

  # Location & Maps
  geolocator: ^13.0.1
  url_launcher: ^6.3.0

  # Realtime Audio/Video Calls (WebRTC)
  flutter_webrtc: ^0.11.7

  # Security & Storage
  encrypt: ^5.0.3
  crypto: ^3.0.5
  shared_preferences: ^2.3.2

  # UI & Utilities
  http: ^1.2.2
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_local_notifications: ^17.2.3
  video_player: ^2.14.0
  open_filex: ^4.7.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
